[package]
name = "etebase"
description = "A Rust client library for Etebase"
homepage = "https://www.etebase.com"
repository = "https://github.com/etesync/etebase-rs/"
version = "0.6.1"
authors = ["Tom Hacohen <tom@stosb.com>"]
edition = "2018"
rust-version = "1.88.0"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["encryption", "sync", "etesync", "cryptography", "firebase"]
categories = ["cryptography", "api-bindings", "database", "development-tools"]
include = [
    "**/*.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["lib"]

[dependencies]
libsodium-rs = "^0.3.0"
url = "^2.2.2"
serde = { version = "^1.0.136", features = ["derive"] }
serde_bytes = "^0.11.5"
serde_repr = "^0.1.7"
rmp-serde = "^1.1.0"
reqwest = { version = "^0.12.24", features = ["blocking"], optional = true }
remove_dir_all = "^0.8.2"

# Not used directly: they raise the minimum versions that reqwest pulls in through native-tls
# (OpenSSL 3 support, CVE-2025-3416). native-tls only uses OpenSSL outside Windows and Apple targets.
[target.'cfg(not(any(windows, target_vendor = "apple")))'.dependencies]
openssl-sys = { version = "^0.9.108", optional = true }
openssl = { version = "^0.10.72", optional = true }

[build-dependencies]
# Transitive build dependency of libsodium-sys-stable (through libflate). Versions before 1.0.2
# abort its build script with an out-of-bounds write, which `-Z minimal-versions` would select.
rle-decode-fast = "^1.0.3"

[features]
default = ["networking"]
networking = ["reqwest", "dep:openssl", "dep:openssl-sys"]
